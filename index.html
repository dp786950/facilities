   return{now:nowA(),rooms:r.data,bookings:b.data.map(x=>({...x,room_name:rn[x.conference_room_id]})),maint:m.data.map(x=>({...x,room_name:rn[x.conference_room_id]}))}}
  catch(e){if(!warned){toast(errMsg(e),1);warned=true}return D}}
 try{if(!ADMIN)throw Error('Administrator login required.');const run=async q=>{const {error}=await q;if(error)throw error};
  if(a=='save_booking'){for(const k of['committee_name','conference_room_id','meeting_date','start_time','end_time','booking_status'])if(!i[k])throw Error('Missing field: '+k);
   const s=i.start_time.slice(0,5),e=i.end_time.slice(0,5);if(e<=s)throw Error('End time must be later than start time.');
   const rec={committee_name:i.committee_name.trim(),conference_room_id:+i.conference_room_id,meeting_date:i.meeting_date,start_time:s,end_time:e,agenda:i.agenda||'',participants:+i.participants||0,contact_person:i.contact_person||'',notes:i.notes||'',booking_status:i.booking_status};
   await run(i.id?sb.from('bookings').update(rec).eq('id',i.id):sb.from('bookings').insert({...rec,created_by:UID}));return{ok:1}}
  if(a=='set_status'){await run(sb.from('bookings').update({booking_status:i.status}).eq('id',i.id));return{ok:1}}
  if(a=='delete_booking'){await run(sb.from('bookings').delete().eq('id',i.id));return{ok:1}}
  if(a=='save_room'){if(!i.room_name||!i.room_code||!['Active','Inactive','Under Maintenance'].includes(i.status))throw Error('Name, code and valid status required.');
   const rec={room_name:i.room_name,room_code:i.room_code,location:i.location||'',seating_capacity:+i.seating_capacity||0,facilities:i.facilities||'',description:i.description||'',status:i.status};
   await run(i.id?sb.from('conference_rooms').update(rec).eq('id',i.id):sb.from('conference_rooms').insert(rec));return{ok:1}}
  if(a=='start_maint'){if(!i.conference_room_id||!i.maintenance_reason||!i.start_date)throw Error('Room, reason and start date required.');
   await run(sb.from('maintenance').insert({conference_room_id:+i.conference_room_id,maintenance_reason:i.maintenance_reason,start_date:i.start_date,expected_completion_date:i.expected_completion_date||null,created_by:UID}));return{ok:1}}
  if(a=='end_maint'){await run(sb.from('maintenance').update({maintenance_status:'Completed',actual_completion_date:nowA().slice(0,10)}).eq('id',i.id));return{ok:1}}
  throw Error('Unknown action')}
 catch(e){toast(errMsg(e),1);throw e}}
async function checkAdmin(sess){UID=sess?.user?.id||null;ME=sess?.user?.email||'';ADMIN=false;
 if(UID){const {data}=await sb.from('admins').select('user_id').eq('user_id',UID).maybeSingle();ADMIN=!!data;if(!ADMIN)toast('This account is not authorised as an administrator.',1)}}
sb.auth.onAuthStateChange((ev,sess)=>{setTimeout(async()=>{const was=ADMIN;
 if(ev=='PASSWORD_RECOVERY'){await checkAdmin(sess);return bx('Choose a new password',`<form onsubmit="setNewPw(event)"><input type="password" id="np2" minlength="8" class="form-control mb-2" placeholder="New password (8+ characters)" required><button class="btn btn-primary w-100">Save new password</button></form>`)}
 if(['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT'].includes(ev)){await checkAdmin(sess);if(ADMIN!==was){if(ADMIN)toast('Signed in as administrator');view='dash';await load();render()}}},0)});
function loginForm(m){
 if(m=='reset')return bx('Reset password',`<form onsubmit="sendReset(event)"><p>Enter the administrator email. A password-reset link will be sent to it.</p><input type="email" id="em" class="form-control mb-2" required><button class="btn btn-primary">Send reset link</button> <a href="#" class="ms-2" onclick="loginForm();return false">Back to login</a></form>`);
 bx('Administrator login',`<form onsubmit="doLogin(event)"><input type="email" id="em" class="form-control mb-2" placeholder="Admin email" required><input type="password" id="pw" class="form-control mb-2" placeholder="Password" required><button class="btn btn-primary w-100">Sign in</button><div class="text-center mt-2"><a href="#" onclick="loginForm('reset');return false">Forgot password? Reset</a></div></form>`)}
async function doLogin(e){e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return toast('Incorrect email or password',1);modal.hide()}
async function sendReset(e){e.preventDefault();const {error}=await sb.auth.resetPasswordForEmail($('#em').value.trim(),{redirectTo:location.origin+location.pathname});
 if(error)return toast(errMsg(error),1);modal.hide();toast('If that email belongs to an administrator, a reset link has been sent. Check your inbox.')}
async function setNewPw(e){e.preventDefault();const {error}=await sb.auth.updateUser({password:$('#np2').value});if(error)return toast(errMsg(error),1);modal.hide();toast('Password updated')}
async function logout(){await sb.auth.signOut()}
V.set=()=>`<h4>Settings</h4><div class="row g-3"><div class="col-lg-6"><form class="panel" onsubmit="setNewPw(event)"><h6>Signed in as ${esc(ME)}</h6><label>New password</label><input type="password" id="np2" minlength="8" class="form-control mb-3" required><button class="btn btn-primary">Change password</button></form></div>
<div class="col-lg-6"><div class="panel"><h6>Page background image</h6><small class="text-muted d-block mb-2"></small><input type="file" accept="image/*" class="form-control mb-2" onchange="setBg(this.files[0])"><button type="button" class="btn btn-outline-secondary" onclick="clearBg()">Remove image</button></div></div></div>`;
